name: Deploy

# Push deploy over a Cloudflare Tunnel.
#
# GitHub-hosted runners are US/Azure IPs and the server is in Iran, which
# filters inbound SSH/TCP from foreign datacenters — so the old
# SSH-from-GitHub deploy timed out. Instead we `git archive` the repo,
# HMAC-sign it, and POST it to an HTTP webhook fronted by a Cloudflare Tunnel
# on the server. The server verifies the signature, syncs the files in, and
# runs `docker compose up -d --build`. See scripts/deploy/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets are set
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::Missing deploy secrets. Add DEPLOY_WEBHOOK_URL and DEPLOY_SECRET under Settings → Secrets and variables → Actions. See scripts/deploy/README.md."
            exit 1
          fi

      - name: Push tarball to server and rebuild
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          set -euo pipefail

          # Payload = exactly the tracked files at this commit (excludes
          # .env, dev.db, node_modules, .git, etc.).
          git archive --format=tar HEAD | gzip > deploy.tar.gz

          # HMAC-SHA256 of the payload with the shared secret. Computed in
          # Python so it matches the receiver byte-for-byte.
          SIG=$(python3 -c 'import hmac,hashlib,sys
          print(hmac.new(sys.argv[1].encode(), open(sys.argv[2],"rb").read(), hashlib.sha256).hexdigest())' \
            "$SECRET" deploy.tar.gz)

          echo "Deploying $(git rev-parse --short HEAD) ($(du -h deploy.tar.gz | cut -f1)) to $URL"

          # The server streams its build log back and ends with a marker line
          # (__DEPLOY_RESULT__ OK | FAIL). A network failure exits non-zero via set -e.
          resp=$(curl -sS --max-time 1800 \
            -X POST "$URL" \
            -H "X-Signature: sha256=$SIG" \
            -H "Content-Type: application/gzip" \
            --data-binary @deploy.tar.gz)

          printf '%s\n' "$resp"

          if ! grep -q '__DEPLOY_RESULT__ OK' <<<"$resp"; then
            echo "::error::Server did not confirm a successful deploy (see log above)."
            exit 1
          fi

          echo "✓ Deploy confirmed by server."
