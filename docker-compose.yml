services:
  app:
    build: .
    volumes:
      - db-data:/app/data
      - uploads:/app/public/uploads
    environment:
      - DATABASE_URL=/app/data/prod.db
      - NO_SMS=false
      - SMS_USERNAME=${SMS_USERNAME}
      - SMS_PASSWORD=${SMS_PASSWORD}
      - SMS_FROM=${SMS_FROM}
    restart: unless-stopped

  proxy:
    image: jonasal/nginx-certbot:latest
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      # Staging issues untrusted test certs but has very high rate limits.
      # Verify issuance works, then set to 0 and wipe the nginx-certs volume.
      - STAGING=1
    volumes:
      - ./nginx/user_conf.d:/etc/nginx/user_conf.d:ro
      - nginx-certs:/etc/letsencrypt
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  nginx-certs:
